# Vérifie le code puis publie l'application (dossier app/) sur GitHub Pages
name: Tests et déploiement sur Pages

on:
  # À chaque push sur main : tests puis déploiement
  push:
    branches: ["main"]

  # Sur les pull requests : tests uniquement
  pull_request:

  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Tests Python
        run: python3 tests/test_math_utils.py
      - name: Vérification du JavaScript et du manifest
        run: |
          node --check app/app.js
          node --check app/service-worker.js
          python3 -m json.tool app/manifest.webmanifest > /dev/null

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Seul le dossier app/ est publié
          path: 'app'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
